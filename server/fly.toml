# Fly.io 배포 설정. 저장소 루트에서: fly deploy --config server/fly.toml --dockerfile server/Dockerfile
# 앱 이름은 fly launch 때 정한 것으로 바꾼다. 비밀값은 fly secrets set SERVER_SECRET=... DATABASE_URL=...
app = "looin-idle-server"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
