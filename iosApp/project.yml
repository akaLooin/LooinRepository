# iOS 앱 프로젝트 정의 (XcodeGen). Xcode 프로젝트 파일은 이 파일로 만든다:
#   brew install xcodegen && cd iosApp && xcodegen generate && open LooinBudget.xcodeproj
# 화면·계산·저장은 모두 Kotlin 공용 모듈(:ui → LooinUi.framework)이고, 여기는 그 화면을 띄우는 껍데기다.
name: LooinBudget
options:
  bundleIdPrefix: com.looin
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ko
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LooinBudget:
    type: application
    platform: iOS
    sources:
      - path: LooinBudget
      # Pretendard 글꼴(Android·PC 와 같은 파일)을 앱 번들 맨 위에 넣는다 → Fonts.ios.kt 가 읽음
      - path: ../ui/src/androidMain/res/font
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: LooinBudget
        PRODUCT_BUNDLE_IDENTIFIER: com.looin.finance
        INFOPLIST_FILE: LooinBudget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "LooinUi"]
    preBuildScripts:
      - name: Kotlin 공용 화면 빌드 (LooinUi.framework)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
    scheme: {}
