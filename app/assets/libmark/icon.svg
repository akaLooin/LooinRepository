<!-- 립마크 (Lib Mark) app icon: a librarian's marking note. Our own drawing (2026-11-21).
     A notebook page with ruled lines, a neon ribbon bookmark hanging over its top edge, and the four-point star
     the app uses to mark a finished day, stamped like a librarian's mark on the first line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17201c"/>
      <stop offset="1" stop-color="#0a0d0c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#ece6d8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff7f"/>
      <stop offset="1" stop-color="#00c864"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g id="bgLayer"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="mark" filter="url(#shadow)">
    <!-- the note -->
    <rect x="262" y="236" width="500" height="580" rx="44" fill="url(#page)"/>
    <!-- spine -->
    <path d="M306 236 h-0 a44 44 0 0 0 -44 44 v492 a44 44 0 0 0 44 44 h22 v-580 z" fill="#d9d1bf"/>
    <!-- ruled lines -->
    <g stroke="#cfc6b3" stroke-width="10" stroke-linecap="round">
      <line x1="384" y1="470" x2="690" y2="470"/>
      <line x1="384" y1="560" x2="690" y2="560"/>
      <line x1="384" y1="650" x2="620" y2="650"/>
    </g>
    <!-- a marker stroke over the second line -->
    <rect x="372" y="532" width="250" height="56" rx="18" fill="#00ff7f" opacity="0.38"/>
    <!-- the star mark (four points, like a finished day) -->
    <path d="M430 330 C440 372 452 384 494 394 C452 404 440 416 430 458 C420 416 408 404 366 394 C408 384 420 372 430 330 Z" fill="#101614"/>
    <!-- ribbon bookmark over the top edge -->
    <path d="M590 196 h96 v300 l-48 -42 l-48 42 z" fill="url(#ribbon)"/>
    <rect x="590" y="196" width="96" height="40" fill="#00a956" opacity="0.55"/>
  </g>
</svg>
