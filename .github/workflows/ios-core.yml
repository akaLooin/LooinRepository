# iOS: 공용 계산 모듈(core)을 iOS 용으로 컴파일·테스트한다. Kotlin/Native iOS 빌드는 macOS 에서만 가능.
# iOS 앱(화면)은 아직 없음 — docs/release/MULTIPLATFORM_ROADMAP.md 참고.
name: iOS core

on:
  push:
    branches: [main, "claude/**"]
    paths: ["core/**", "gradle/**", "*.gradle.kts", ".github/workflows/ios-core.yml"]
  pull_request:
    paths: ["core/**"]

jobs:
  ios-core:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core on iOS simulator and build framework
        run: ./gradlew :core:iosSimulatorArm64Test :core:linkReleaseFrameworkIosArm64 --stacktrace
