# iOS: 공용 계산(core)·데이터(shared, Room KMP + 번들 SQLite) 모듈을 iOS 용으로 컴파일·테스트한다.
# Kotlin/Native iOS 빌드는 macOS 에서만 가능. iOS 앱(화면) 빌드·실행은 ios-app.yml.
name: iOS core

on:
  push:
    branches: [main, "claude/**"]
    paths: ["core/**", "shared/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/ios-core.yml"]
  pull_request:
    paths: ["core/**", "shared/**"]

jobs:
  ios-core:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core and shared on iOS simulator, build device frameworks
        run: ./gradlew :core:iosSimulatorArm64Test :shared:iosSimulatorArm64Test :core:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosArm64 --stacktrace
