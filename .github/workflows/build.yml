name: Build

# 푸시할 때마다 서버를 테스트하고, Android APK 와 서버 배포본을 만들어
# Actions 실행 결과의 "Artifacts" 에 올린다 → PC 없이 폰에서 APK 를 받을 수 있다.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test server
        run: ./gradlew :server:test
      - name: Build Android APK and server
        run: ./gradlew :composeApp:assembleDebug :server:distZip
      - uses: actions/upload-artifact@v4
        with:
          name: LooinWorld-android-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LooinWorld-server
          path: server/build/distributions/server-*.zip
