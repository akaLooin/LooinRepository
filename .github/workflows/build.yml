name: Build

# 푸시할 때마다 서버를 테스트하고, Android APK 와 서버 배포본을 만든다.
#  - Actions 실행 결과의 "Artifacts" 에 APK 와 서버 zip 을 올린다.
#  - 서버 zip 은 "server-latest" 릴리스에도 올려서, 클라우드 서버가 바로 내려받아 설치할 수 있게 한다
#    (작은 무료 서버에서 직접 빌드하지 않아도 되도록).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test server
        run: ./gradlew :server:test
      - name: Build Android APK and server
        run: |
          ./gradlew :composeApp:assembleDebug :server:distZip
          cp server/build/distributions/server-*.zip looin-server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LooinWorld-android-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LooinWorld-server
          path: looin-server.zip
      - name: Publish server to the server-latest release
        if: github.ref == 'refs/heads/claude/personal-ai-world-platform-0vh9be' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-latest
          name: Looin server (latest build)
          prerelease: true
          make_latest: false
          files: looin-server.zip
