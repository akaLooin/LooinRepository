# Android: 모든 푸시·PR 에서 테스트·lint·디버그 빌드, v* 태그에서 서명된 AAB 생성.
# 필요한 저장소 Secrets (docs/release/ANDROID_RELEASE.md 참고):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, debug build
        run: ./gradlew test :app:lintRelease :app:assembleDebug --stacktrace
      - name: Upload reports and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/screenshots/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        env:
          LOOIN_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          LOOIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOOIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LOOIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 스토어는 업로드마다 versionCode 증가가 필요: 100 + 워크플로 실행 번호
          LOOIN_VERSION_CODE: ${{ github.run_number }}
        run: |
          export LOOIN_VERSION_CODE=$((100 + LOOIN_VERSION_CODE))
          ./gradlew :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
