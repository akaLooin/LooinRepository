# PC 설치 파일: Windows(MSI·EXE)는 Windows 러너, macOS(DMG)는 macOS 러너에서 만든다(jpackage 는 교차 빌드 불가).
# 아직 코드 서명 없음 → Windows SmartScreen 경고, macOS Gatekeeper 차단이 날 수 있다(docs/release/DESKTOP_RELEASE.md).
name: Desktop

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*", "desktop-v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests and Windows installers
        run: ./gradlew :desktopApp:test :desktopApp:packageMsi :desktopApp:packageExe --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: macOS disk image (unsigned)
        run: ./gradlew :desktopApp:packageDmg --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
